name: Axycord Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axycord-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AXYCORD_BUILD_ID: ${{ github.run_number }}
      AXYCORD_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check required app inputs
        run: |
          test -d app/src/main/jniLibs || { echo "::error::Restore the required native libraries before building Axycord"; exit 1; }
          test -f app/src/main/res/values/styles.xml || { echo "::error::Restore the recovered Android resources before building Axycord"; exit 1; }

      - name: Restore Axycord signing identity
        env:
          AXYCORD_KEYSTORE_BASE64: ${{ secrets.AXYCORD_KEYSTORE_BASE64 }}
        run: |
          test -n "$AXYCORD_KEYSTORE_BASE64" || { echo "::error::Set AXYCORD_KEYSTORE_BASE64 to the app's stable development keystore"; exit 1; }
          printf '%s' "$AXYCORD_KEYSTORE_BASE64" | base64 --decode > app/axycord-dev.keystore

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: Check supported Android APIs
        run: bash scripts/build.sh :app:lintDebug :plugin-api:lintDebug

      - name: Build Axycord APKs and update manifest
        run: bash scripts/build.sh :app:assembleDebug :app:assembleRelease :app:generateReleaseUpdateManifest

      - name: Save Axycord build outputs
        uses: actions/upload-artifact@v4
        with:
          name: axycord-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/update/release/update-manifest.json
